<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Top Shell Gradient -->
    <linearGradient id="redShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E1E" />
      <stop offset="100%" stop-color="#C80000" />
    </linearGradient>
    
    <!-- Bottom Shell Gradient -->
    <linearGradient id="whiteShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Button Inner Glow -->
    <radialGradient id="buttonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Ball Body -->
  <g filter="url(#dropShadow)">
    <!-- Outer Black Border Circle -->
    <circle cx="256" cy="256" r="240" fill="#0A0A0C" />

    <!-- Red Top Half -->
    <path d="M 256,24 A 232,232 0 0,1 488,240 L 336,240 A 80,80 0 0,0 176,240 L 24,240 A 232,232 0 0,1 256,24 Z" fill="url(#redShell)" />

    <!-- Top Gloss Reflection -->
    <path d="M 256,36 A 220,220 0 0,1 460,210 A 232,232 0 0,0 256,48 A 232,232 0 0,0 52,210 A 220,220 0 0,1 256,36 Z" fill="url(#gloss)" />

    <!-- White Bottom Half -->
    <path d="M 24,272 L 176,272 A 80,80 0 0,0 336,272 L 488,272 A 232,232 0 0,1 256,488 A 232,232 0 0,1 24,272 Z" fill="url(#whiteShell)" />

    <!-- Center Black Horizontal Band -->
    <rect x="16" y="236" width="480" height="40" fill="#0A0A0C" rx="4" />

    <!-- Center Outer Ring -->
    <circle cx="256" cy="256" r="76" fill="#0A0A0C" />

    <!-- Center Inner Ring -->
    <circle cx="256" cy="256" r="54" fill="#1E293B" stroke="#0A0A0C" stroke-width="4" />

    <!-- Center Glowing Button -->
    <circle cx="256" cy="256" r="38" fill="url(#buttonGlow)" stroke="#94A3B8" stroke-width="3" />

    <!-- Center Button Inner Highlight Ring -->
    <circle cx="256" cy="256" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
  </g>
</svg>
